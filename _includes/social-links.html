<ul class="social">
  {% if site.github_username %}
  <li><a href="https://github.com/{{ site.github_username }}" rel="me noopener" target="_blank" aria-label="GitHub">{% include icon.html name='github' %}<span>GitHub</span></a></li>
  {% endif %}
  {% if site.linkedin_username %}
  <li><a href="https://www.linkedin.com/in/{{ site.linkedin_username }}/" rel="me noopener" target="_blank" aria-label="LinkedIn">{% include icon.html name='linkedin' %}<span>LinkedIn</span></a></li>
  {% endif %}
  {% if site.email %}
  <li><a href="mailto:{{ site.email }}" aria-label="Email">{% include icon.html name='mail' %}<span>Email</span></a></li>
  {% endif %}
</ul>
