---
layout: page
title: Get in touch
permalink: /contact/
eyebrow: Contact
lead: >-
  Open to junior ML / AI engineer roles, long-term internships and research
  collaborations.
---
<div class="contact-grid">
  <form class="contact-form" action="https://formspree.io/f/{{ site.formspree_id }}" method="POST" data-contact-form>
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>
    </div>
    <input type="hidden" name="_subject" value="New message from {{ site.url | remove: 'https://' }}">
    <input type="text" name="_gotcha" class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="btn btn-primary" type="submit">Send message {% include icon.html name='arrow' %}</button>
    <p class="form-status" role="status" aria-live="polite"></p>
  </form>

  <aside class="contact-aside">
    <h2>Elsewhere</h2>
    <p class="muted">Prefer email or LinkedIn? That works too.</p>
    {% include social-links.html %}
    {% include cv-button.html %}
  </aside>
</div>
