---
layout: default
---
<section class="page-head">
  <div class="container narrow">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>

<div class="container {% unless page.wide %}narrow{% endunless %} page-body">
  {{ content }}
</div>
